---
kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: maintenance-page
parameters:
  - name: ENV_NAME
    displayName: Environment name
    description: The environment name
    required: true
objects:
  - kind: Deployment
    apiVersion: apps/v1
    metadata:
      name: maintenance-page
      labels:
        app: maintenance-page
    spec:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 25%
          maxSurge: 25%
      replicas: 1
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: maintenance-page
      template:
        metadata:
          labels:
            app: maintenance-page
          annotations:
            openshift.io/generated-by: OpenShiftNewApp
        spec:
          containers:
            - name: maintenance-page
              image: image-registry.openshift-image-registry.svc:5000/0ab226-tools/maintenance-page:prod
              command:
                - httpd
              args:
                - -D
                - FOREGROUND
                - -C
                - ServerName localhost
              ports:
                - containerPort: 8080
                  protocol: TCP
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              terminationMessagePath: "/dev/termination-log"
              terminationMessagePolicy: File
              imagePullPolicy: Always
          restartPolicy: Always
          terminationGracePeriodSeconds: 30
          dnsPolicy: ClusterFirst
          securityContext: {}
          schedulerName: default-scheduler
  - kind: Service
    apiVersion: v1
    metadata:
      name: maintenance-page
      creationTimestamp:
      labels:
        app: maintenance-page
    spec:
      ports:
        - name: 8080-tcp
          protocol: TCP
          port: 8080
          targetPort: 8080
      selector:
        app: maintenance-page
      type: ClusterIP
      sessionAffinity: None
  - kind: Route
    apiVersion: route.openshift.io/v1
    metadata:
      name: maintenance-page
      creationTimestamp:
      labels:
        app: maintenance-page
      annotations:
        openshift.io/host.generated: "true"
    spec:
      host: maintenance-page-${ENV_NAME}.apps.silver.devops.gov.bc.ca
      to:
        kind: Service
        name: maintenance-page
        weight: 100
      port:
        targetPort: 8080-tcp
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
      wildcardPolicy: None
